{% extends 'base.html' %}

{% block title %}Login - Car Sharing System{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <h2>Login</h2>
        <p class="auth-subtitle">Welcome back to CarShare</p>

        <form method="POST" class="auth-form">
            {% csrf_token %}

            <div class="form-group">
                <label for="phone_number">Phone Number</label>
                <input type="text" id="phone_number" name="phone_number" required pattern="[0-9]{10}" maxlength="10"
                    inputmode="numeric" placeholder="Enter 10-digit number" title="Enter exactly 10 digits"
                    oninput="this.value = this.value.replace(/[^0-9]/g, '').slice(0,10)">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
            </div>

            <button type="submit" class="btn btn-primary btn-block">Login</button>

            <p class="auth-link">Don't have an account? <a href="{% url 'register' %}">Register here</a></p>
        </form>
    </div>
</div>
{% endblock %}
