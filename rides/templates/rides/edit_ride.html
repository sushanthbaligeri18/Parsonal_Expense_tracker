{% extends 'base.html' %}
{% load static %}

{% block title %}Edit Ride - Car Sharing System{% endblock %}

{% block content %}
<div class="container">
    <div class="form-container">
        <h1>Edit Ride</h1>
        
        <form method="POST" class="ride-form">
            {% csrf_token %}
            
            <div class="form-section">
                <h3>📍 Route Information</h3>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="from_location">From Location *</label>
                        <input type="text" id="from_location" name="from_location" required value="{{ ride.from_location }}">
                    </div>
                    
                    <div class="form-group">
                        <label for="to_location">To Location *</label>
                        <input type="text" id="to_location" name="to_location" required value="{{ ride.to_location }}">
                    </div>
                </div>
            </div>
            
            <div class="form-section">
                <h3>🚗 Ride Details</h3>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="departure_datetime">Departure Date & Time *</label>
                        <input type="datetime-local" id="departure_datetime" name="departure_datetime" required value="{{ ride.departure_datetime|date:'Y-m-dTH:i' }}">
                    </div>
                    
                    <div class="form-group">
                        <label for="arrival_datetime">Arrival Date & Time *</label>
                        <input type="datetime-local" id="arrival_datetime" name="arrival_datetime" required value="{{ ride.arrival_datetime|date:'Y-m-dTH:i' }}">
                    </div>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="available_seats">Available Seats *</label>
                        <input type="number" id="available_seats" name="available_seats" min="1" max="10" required value="{{ ride.available_seats }}">
                    </div>
                    
                    <div class="form-group">
                        <label for="price_per_seat">Price per Seat (₹) *</label>
                        <input type="number" id="price_per_seat" name="price_per_seat" min="0" step="0.01" required value="{{ ride.price_per_seat }}">
                    </div>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="phone_number">Phone Number *</label>
                        <input type="tel" id="phone_number" name="phone_number" required value="{{ ride.phone_number }}">
                    </div>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="car_name">Car Name</label>
                        <input type="text" id="car_name" name="car_name" value="{{ ride.car_name }}">
                    </div>
                    
                    <div class="form-group">
                        <label for="car_number">Car Number (License Plate)</label>
                        <input type="text" id="car_number" name="car_number" value="{{ ride.car_number }}">
                    </div>
                </div>
            </div>
            
            <div class="form-actions">
                <button type="submit" class="btn btn-primary btn-lg">Update Ride</button>
                <a href="{% url 'ride_detail' ride.id %}" class="btn btn-secondary btn-lg">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
