{% extends 'base.html' %}
{% load static %}

{% block title %}Add New Ride - Car Sharing System{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/map.css' %}">
{% endblock %}

{% block content %}
<div class="container">
    <div class="form-container">
        <h1>Post a New Ride</h1>

        <form method="POST" class="ride-form">
            {% csrf_token %}

            <div class="form-section">
                <h3>📍 Route Information</h3>

                <div class="form-row">
                    <div class="form-group">
                        <label for="from_location">From Location *</label>
                        <input type="text" id="from_location" name="from_location" required pattern="[A-Za-z\s]+"
                            title="Only letters and spaces allowed"
                            oninput="this.value = this.value.replace(/[^A-Za-z\s]/g, '')"
                            placeholder="e.g., Downtown, City Center">
                    </div>

                    <div class="form-group">
                        <label for="to_location">To Location *</label>
                        <input type="text" id="to_location" name="to_location" required placeholder="e.g., Airport"
                            pattern="[A-Za-z\s]+" title="Only letters and spaces allowed"
                            oninput="this.value = this.value.replace(/[^A-Za-z\s]/g, '')">
                    </div>
                </div>

            </div>

            <!-- Ride Details -->
            <div class="form-section">
                <h3>🚗 Ride Details</h3>

                <div class="form-row">
                   <div class="form-group">
    <label for="departure_datetime">Departure Date & Time *</label>
    <input type="datetime-local" id="departure_datetime" name="departure_datetime" required>
</div>

<div class="form-group">
    <label for="arrival_datetime">Arrival Date & Time *</label>
    <input type="datetime-local" id="arrival_datetime" name="arrival_datetime" required>
</div>


                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="available_seats">Available Seats *</label>
                        <input type="number" id="available_seats" name="available_seats" min="1" max="10" required
                            value="1" onkeydown="return event.key !== '-'">
                    </div>

                    <div class="form-group">
    <label for="price_per_seat">Price per Seat (₹) *</label>
    <input type="number" id="price_per_seat" name="price_per_seat" min="0" step="1" required 
           onkeydown="return event.key !== '-'">
</div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="phone_number">Phone Number *</label>
                        <input type="tel" id="phone_number" name="phone_number" required placeholder="+1 (555) 123-4567"
                            value="{{ phone_number }}">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="car_name">Car Name</label>
                        <input type="text" id="car_name" name="car_name" placeholder="e.g., Toyota Camry, Honda Civic">
                    </div>

                  <div class="form-group">
    <label for="car_number">Car Number (License Plate)</label>
    <input type="text" id="car_number" name="car_number"
        placeholder="e.g., KA01AB1234"
        maxlength="10"
        title="Enter valid format: KA01AB1234"
        required
        oninput="this.value = this.value.replace(/[^a-zA-Z0-9]/g, '').toUpperCase()"
        onkeydown="return /^[a-zA-Z0-9]$/.test(event.key) || event.key === 'Backspace' || event.key === 'Tab'">
</div>
                </div>
            </div>

            <!-- Submit -->
            <div class="form-actions">
                <button type="submit" class="btn btn-primary btn-lg">Post Ride</button>
                <a href="{% url 'dashboard' %}" class="btn btn-secondary btn-lg">Cancel</a>
            </div>
        </form>
    </div>
</div>

{% endblock %}
